# INACTIVE REVIEW TEMPLATE: no installation or execution authorized.
name: Controller secret-free Darwin diagnostic
'on':
  workflow_dispatch:
    inputs:
      approved_controller_commit:
        description: Exact controller installation commit separately approved for this discovery
        type: string
        required: true
permissions: {}
concurrency:
  group: spamback-native-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' &&
      github.repository_id == '1443482676' && github.event.repository.private == false &&
      github.actor_id == '344105751' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    environment: TestFlight-Approval
    runs-on: macos-26
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Compile pinned native sources and collect screened disposable-fixture observations
        env:
          APPROVED_CONTROLLER_COMMIT: ${{ inputs.approved_controller_commit }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          root="$(mktemp -d "$RUNNER_TEMP/spamback-native.XXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          export SPAMBACK_NATIVE_ROOT="$root"
          python3 -I - <<'PY'
          import base64, hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          approved=os.environ.get('APPROVED_CONTROLLER_COMMIT','')
          if (not re.fullmatch(r'[a-f0-9]{40}',approved) or os.environ.get('GITHUB_SHA')!=approved
              or os.environ.get('GITHUB_REPOSITORY_ID')!='1443482676'
              or os.environ.get('GITHUB_REPOSITORY')!='SpamBackReleaseControl/SpamBack-Release-Controller'
              or os.environ.get('GITHUB_WORKFLOW_SHA')!=approved
              or os.environ.get('GITHUB_WORKFLOW_REF')!='SpamBackReleaseControl/SpamBack-Release-Controller/.github/workflows/controller-native-diagnostic.yml@refs/heads/main'
              or os.environ.get('GITHUB_ACTOR_ID')!='344105751'
              or os.environ.get('GITHUB_EVENT_NAME')!='workflow_dispatch'
              or os.environ.get('GITHUB_REF')!='refs/heads/main'
              or os.environ.get('GITHUB_RUN_ATTEMPT')!='1'):
              raise SystemExit('Exact separately approved public-controller runtime required')
          root=Path(os.environ['SPAMBACK_NATIVE_ROOT'])
          files={'darwin_acl_probe.c': {'sha256': 'c38351a14735a23cda5fb174b904c23167245982029db67f56c5a498465334c7', 'base64': ''}, 'darwin_metadata.c': {'sha256': 'c522905365ef6c04411e8fe35bfd0b7c35b789e69bde51ee092b8932df88373f', 'base64': ''}, 'darwin_transcript.py': {'sha256': 'a534f1dc8cd8589df8d63f2a6b9b545d1a8cb2e98afb3ad2ebdabad4c17e0a1b', 'base64': ''}, 'qualify_darwin_diagnostic.py': {'sha256': '4eea6ba7da08dc0ecd7bdebf48faf6d6af8395ce3821d0912769a7651aea7a9c', 'base64': ''}}
          for name,item in files.items():
              raw=base64.b64decode(item['base64'],validate=True)
              if hashlib.sha256(raw).hexdigest()!=item['sha256']:
                  raise SystemExit('Embedded native source differs from reviewed pin')
              with (root/name).open('xb') as out:out.write(raw)
          subprocess.run([sys.executable,'-I',str(root/'qualify_darwin_diagnostic.py')],check=True)
          PY
