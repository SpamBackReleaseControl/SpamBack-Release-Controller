# INACTIVE. Exact owner approval, protected merge and independent deployment review required.
name: Controller credential-free native staging integration
'on':
  workflow_dispatch:
    inputs:
      approved_controller_commit:
        description: Exact separately approved controller installation commit
        required: true
        type: string
permissions: {}
concurrency:
  group: spamback-native-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    if: >-
      github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' &&
      github.repository_id == '1443482676' && github.event.repository.private == false &&
      github.actor_id == '344105751' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    environment: TestFlight-Approval
    runs-on: macos-26
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Compile qualified predicate and verify dummy unsigned descriptor staging
        env:
          APPROVED_CONTROLLER_COMMIT: ${{ inputs.approved_controller_commit }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          root="$(mktemp -d "$RUNNER_TEMP/spamback-stage.XXXXXX")"
          trap 'rm -rf -- "$root"' EXIT
          export SPAMBACK_NATIVE_ROOT="$root"
          python3 -I - <<'PYCODE'
          import base64,hashlib,os,re,subprocess,sys
          from pathlib import Path
          approved=os.environ.get('APPROVED_CONTROLLER_COMMIT','')
          expected={'GITHUB_REPOSITORY_ID':'1443482676','GITHUB_REPOSITORY':'SpamBackReleaseControl/SpamBack-Release-Controller',
              'GITHUB_ACTOR_ID':'344105751','GITHUB_EVENT_NAME':'workflow_dispatch','GITHUB_REF':'refs/heads/main','GITHUB_RUN_ATTEMPT':'1',
              'GITHUB_WORKFLOW_REF':'SpamBackReleaseControl/SpamBack-Release-Controller/.github/workflows/controller-native-diagnostic.yml@refs/heads/main'}
          if (re.fullmatch('[a-f0-9]{40}',approved) is None or os.environ.get('GITHUB_SHA')!=approved
              or os.environ.get('GITHUB_WORKFLOW_SHA')!=approved or any(os.environ.get(k)!=v for k,v in expected.items())):
              raise SystemExit('Exact independently approved public-controller runtime required')
          root=Path(os.environ['SPAMBACK_NATIVE_ROOT'])
          files={'darwin_stage.py': {'sha256': 'f57721ba1db0f5c3fd4ca3caf0cf5e28fdba8d8785642dac1b9a8c079a8a571c', 'base64': ''}, 'darwin_admission.c': {'sha256': 'a11b7a994fa8e5f28ebbc5a77e74c6c39719d59b4f31b68fb895542178a3fabe', 'base64': ''}, 'apfs_runtime_gate.py': {'sha256': '895671032a7e2f42d304fb9015477dc646e136458a3b494c467d16ebd1a9396b', 'base64': ''}, 'tree_admission.py': {'sha256': '7be8b6ef30d8ccd73f1242d9b8e9ef1b476675899a43c2c6ce8ae6c974264bb4', 'base64': ''}, 'archive_admission.py': {'sha256': '3cde04246078fda9927fada89e0f9530012df1f9b6b3a3230f84afb714686ebc', 'base64': ''}, 'stage_admission.py': {'sha256': 'eff6bd39bdee862406fab86569a161c119402bf677fe02eab9c2012d8599e3b8', 'base64': ''}, 'unsigned_boundary.py': {'sha256': '37d2e323a62d3517e065e8b041f665b33059f5e2687e8e7b211e7da5dc0547a4', 'base64': ''}, 'unsigned_package.py': {'sha256': '86c603ee8d672d2ea109e7c23c02e85a1695a863185fd7f52111f880697c8f6b', 'base64': ''}, 'native_staging_smoke.py': {'sha256': '851653327fc1c2bba65b0b6dcde7def736c3401b6812fb79c4a0ae034435a12c', 'base64': ''}, 'apfs-qualification-43772206331/RESULT.json': {'sha256': 'b33a17870198c91955fc578d956f7c39ec2c892ef12f554533bd9c948a47655f', 'base64': ''}, 'apfs_qualified_runtime.py': {'sha256': '39cf61644989d35db47c1f9884fe88ce2ab68978a08bd600a0e6e2c6417a0e0f', 'base64': ''}}
          for name,item in files.items():
              raw=base64.b64decode(item['base64'],validate=True)
              if hashlib.sha256(raw).hexdigest()!=item['sha256']:raise SystemExit('Pinned staging source differs')
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
              with target.open('xb') as out:out.write(raw)
          subprocess.run([sys.executable,'-I',str(root/'native_staging_smoke.py')],check=True)
          PYCODE
