name: SpamBack independent environment approval test
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  spouse_review_gate:
    if: >-
      github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Spamback' &&
      github.event.issue.user.login == 'Spamback' &&
      github.event.issue.title == 'SpamBack DUMMY approval gate test'
    environment: TestFlight-Approval
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Dummy confirmation only
        run: echo 'Dummy approval gate completed. NO RELEASE AUTHORIZED.'
