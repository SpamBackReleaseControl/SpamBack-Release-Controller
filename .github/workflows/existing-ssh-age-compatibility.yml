# INACTIVE REVIEW COPY: installation and ONE run require separate owner approval.
# Only the existing protected SSH identity; dummy plaintext, no Apple/feed values.
name: Existing SSH age compatibility (APPROVAL REQUIRED)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: spamback-existing-ssh-age-compatibility
  cancel-in-progress: false
jobs:
  compatibility:
    if: >-
      github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' &&
      github.repository_id == '1443482676' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '344105751' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment: TestFlight-Approval
    timeout-minutes: 3
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Stage pinned upstream age and exact compatibility helper without credentials
        run: |
          set +x
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/spamback-age-compat"
          mkdir -m 700 "$root"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 45 \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            -o "$root/age.tar.gz" 2>/dev/null
          python3 - <<'PYCODE'
          import base64,hashlib,os,tarfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'spamback-age-compat'
          archive=root/'age.tar.gz'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10':
              raise SystemExit('Pinned age archive refused')
          with tarfile.open(archive) as source:
              member=source.getmember('age/age')
              if not member.isfile() or member.size>30000000:raise SystemExit('Pinned age member refused')
              raw=source.extractfile(member).read()
          if hashlib.sha256(raw).hexdigest() != 'eb7dd1b518f0a307c99cd97782623c5321da049154b04acd2d98d21aa7bc9b2c':
              raise SystemExit('Pinned age executable refused')
          with (root/'age').open('xb') as out:out.write(raw)
          (root/'age').chmod(0o500)
          raw=base64.b64decode('',validate=True)
          if hashlib.sha256(raw).hexdigest() != '67b6f1667f19509359750a3aebd43c2feb21d8145ba84876f67423f186ed8bab':raise SystemExit('Pinned helper refused')
          with (root/'check.py').open('xb') as out:out.write(raw)
          (root/'check.py').chmod(0o400)
          PYCODE
      - name: Verify existing recipient with dummy bytes only
        env:
          SPAMBACK_SOURCE_READONLY_DEPLOY_KEY: ${{ secrets.SPAMBACK_SOURCE_READONLY_DEPLOY_KEY }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          export TMPDIR="$RUNNER_TEMP/spamback-age-compat"
          export SPAMBACK_AGE_BINARY="$RUNNER_TEMP/spamback-age-compat/age"
          python3 -I "$RUNNER_TEMP/spamback-age-compat/check.py"
      - name: Remove temporary compatibility files
        if: ${{ always() }}
        run: |
          set +x
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/spamback-age-compat"
