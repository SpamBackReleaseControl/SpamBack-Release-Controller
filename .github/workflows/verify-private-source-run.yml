name: Off-main unsigned qualification authorization (inactive)
run-name: ${{ format('Unsigned authorization {0}', inputs.plan_sha256) }}
'on':
  workflow_dispatch:
    inputs:
      plan_json:
        description: Exact approved nonsecret source/reader/expiry bindings
        required: true
        type: string
      plan_sha256:
        description: Independently approved canonical plan digest
        required: true
        type: string
permissions: {}
concurrency:
  group: spamback-independent-source-read
  cancel-in-progress: false
jobs:
  source-read-preflight:
    if: github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' && github.repository_id == '1443482676'
      && github.event.repository.private == false && github.actor_id == '344105751' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
    - name: Refuse unreviewed activation
      run: exit 78
    - name: Materialize exact controller-owned GET-only helper
      shell: bash
      run: "set +x\nset -euo pipefail\numask 077\nmkdir -m 700 \"$RUNNER_TEMP/spamback-source-reader\"\npython3 -I - <<'PYCODE'\n\
        import base64,hashlib,os\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'spamback-source-reader'\n\
        files = {'reader.py': '',\
        \ 'artifact_evidence.py': '',\
        \ 'unsigned_boundary.py': '',\
        \ 'stage_admission.py': '',\
        \ 'archive_admission.py': '',\
        \ 'tree_admission.py': '',\
        \ 'age_handoff_import.py': '',\
        \ 'age-handoff/handoff_workflow.py': '',\
        \ 'age-handoff/handoff_provenance.py': '',\
        \ 'age-handoff/private_publication.py': '',\
        \ 'reviewed_source_route.py': ''}\n\
        pins = {'reader.py': '1b13e515e5190c0395a50a9fdf607f2544731d06caabbb5f6bd7351ee6cdca31', 'artifact_evidence.py': '9f1880f607980ea7daa985ca8d99ab84994718e6c0ae825634cc331162971d55',\
        \ 'unsigned_boundary.py': 'b629bd73c12d4c2d6f14f601e37e62f93236adda110883432ceecf84faec1e4d', 'stage_admission.py':\
        \ 'eff6bd39bdee862406fab86569a161c119402bf677fe02eab9c2012d8599e3b8', 'archive_admission.py': '3cde04246078fda9927fada89e0f9530012df1f9b6b3a3230f84afb714686ebc',\
        \ 'tree_admission.py': '7be8b6ef30d8ccd73f1242d9b8e9ef1b476675899a43c2c6ce8ae6c974264bb4', 'age_handoff_import.py':\
        \ 'c0e01898cbccb7e5058d28359d8df411d698ca2cb2a031cd921e35a93fac86fa', 'age-handoff/handoff_workflow.py': 'ac2597669ae34e1d53f5ea7ef886378fd1e419115d0693b3d47b3fb96faabe3b',\
        \ 'age-handoff/handoff_provenance.py': 'c7dc9a37239024985a35d324b73cb827ef62f8c239974061cf43d62cbcfb8c99', 'age-handoff/private_publication.py':\
        \ '830018ac855950e279ff03d2bfe8a300c3ef99e05e493a24ade4e73df99fec86', 'reviewed_source_route.py': 'bc3786333fd86a46e2669238158c28066089e5f73944563cef62aac4d06f0361'}\n\
        for name,encoded in files.items():\n    raw=base64.b64decode(encoded,validate=True)\n    if hashlib.sha256(raw).hexdigest()!=pins[name]:raise\
        \ SystemExit('Reader helper pin refused')\n    target=root/name\n    target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)\n\
        \    with target.open('xb') as out:out.write(raw)\nPYCODE\n"
    - name: Print only independent approval instruction
      env:
        SOURCE_READ_PLAN_JSON: ${{ inputs.plan_json }}
        SOURCE_READ_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      run: python3 -I "$RUNNER_TEMP/spamback-source-reader/reader.py" preflight
    - name: Remove public helper scratch
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/spamback-source-reader"
  verify-source-run:
    needs: source-read-preflight
    if: github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' && github.repository_id == '1443482676'
      && github.event.repository.private == false && github.actor_id == '344105751' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    environment: TestFlight-Approval
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
    - name: Refuse unreviewed activation
      run: exit 78
    - name: Materialize exact controller-owned GET-only helper
      shell: bash
      run: "set +x\nset -euo pipefail\numask 077\nmkdir -m 700 \"$RUNNER_TEMP/spamback-source-reader\"\npython3 -I - <<'PYCODE'\n\
        import base64,hashlib,os\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'spamback-source-reader'\n\
        files = {'reader.py': '',\
        \ 'artifact_evidence.py': '',\
        \ 'unsigned_boundary.py': '',\
        \ 'stage_admission.py': '',\
        \ 'archive_admission.py': '',\
        \ 'tree_admission.py': '',\
        \ 'age_handoff_import.py': '',\
        \ 'age-handoff/handoff_workflow.py': '',\
        \ 'age-handoff/handoff_provenance.py': '',\
        \ 'age-handoff/private_publication.py': '',\
        \ 'reviewed_source_route.py': ''}\n\
        pins = {'reader.py': '1b13e515e5190c0395a50a9fdf607f2544731d06caabbb5f6bd7351ee6cdca31', 'artifact_evidence.py': '9f1880f607980ea7daa985ca8d99ab84994718e6c0ae825634cc331162971d55',\
        \ 'unsigned_boundary.py': 'b629bd73c12d4c2d6f14f601e37e62f93236adda110883432ceecf84faec1e4d', 'stage_admission.py':\
        \ 'eff6bd39bdee862406fab86569a161c119402bf677fe02eab9c2012d8599e3b8', 'archive_admission.py': '3cde04246078fda9927fada89e0f9530012df1f9b6b3a3230f84afb714686ebc',\
        \ 'tree_admission.py': '7be8b6ef30d8ccd73f1242d9b8e9ef1b476675899a43c2c6ce8ae6c974264bb4', 'age_handoff_import.py':\
        \ 'c0e01898cbccb7e5058d28359d8df411d698ca2cb2a031cd921e35a93fac86fa', 'age-handoff/handoff_workflow.py': 'ac2597669ae34e1d53f5ea7ef886378fd1e419115d0693b3d47b3fb96faabe3b',\
        \ 'age-handoff/handoff_provenance.py': 'c7dc9a37239024985a35d324b73cb827ef62f8c239974061cf43d62cbcfb8c99', 'age-handoff/private_publication.py':\
        \ '830018ac855950e279ff03d2bfe8a300c3ef99e05e493a24ade4e73df99fec86', 'reviewed_source_route.py': 'bc3786333fd86a46e2669238158c28066089e5f73944563cef62aac4d06f0361'}\n\
        for name,encoded in files.items():\n    raw=base64.b64decode(encoded,validate=True)\n    if hashlib.sha256(raw).hexdigest()!=pins[name]:raise\
        \ SystemExit('Reader helper pin refused')\n    target=root/name\n    target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)\n\
        \    with target.open('xb') as out:out.write(raw)\nPYCODE\n"
    - name: Authorize exact credential-free unsigned qualification; no private token
      env:
        SOURCE_READ_PLAN_JSON: ${{ inputs.plan_json }}
        SOURCE_READ_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      shell: bash
      run: 'set +x

        set -euo pipefail

        python3 -I "$RUNNER_TEMP/spamback-source-reader/reader.py" authorize-unsigned

        '
    - name: Remove helper scratch on every outcome
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/spamback-source-reader"
