# ACTIVATION PROPOSAL ONLY: install/use only after separate exact owner and independent approval.
name: Independent private source API verification (PROTECTED)
run-name: Source attestation ${{ inputs.plan_sha256 }}
'on':
  workflow_dispatch:
    inputs:
      plan_json:
        description: Exact approved nonsecret source/reader/expiry bindings
        required: true
        type: string
      plan_sha256:
        description: Independently approved canonical plan digest
        required: true
        type: string
permissions: {}
concurrency:
  group: spamback-independent-source-read
  cancel-in-progress: false
jobs:
  source-read-preflight:
    if: >-
      github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' &&
      github.repository_id == '1443482676' && github.event.repository.private == false &&
      github.actor_id == '344105751' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Materialize exact controller-owned GET-only helper
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/spamback-source-reader"
          python3 -I - <<'PYCODE'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode('',validate=True)
          if hashlib.sha256(raw).hexdigest()!='9e50037af2eadacf80862412929ef6ce13079f25911d16d54b28766e74fe0b36':raise SystemExit('Reader helper pin refused')
          with (Path(os.environ['RUNNER_TEMP'])/'spamback-source-reader/reader.py').open('xb') as out:out.write(raw)
          PYCODE
      - name: Print only independent approval instruction
        env:
          SOURCE_READ_PLAN_JSON: ${{ inputs.plan_json }}
          SOURCE_READ_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: python3 -I "$RUNNER_TEMP/spamback-source-reader/reader.py" preflight
      - name: Remove public helper scratch
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/spamback-source-reader"
  verify-source-run:
    needs: source-read-preflight
    if: >-
      github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' &&
      github.repository_id == '1443482676' && github.event.repository.private == false &&
      github.actor_id == '344105751' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    environment: TestFlight-Approval
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Materialize exact controller-owned GET-only helper
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/spamback-source-reader"
          python3 -I - <<'PYCODE'
          import base64,hashlib,os
          from pathlib import Path
          raw=base64.b64decode('',validate=True)
          if hashlib.sha256(raw).hexdigest()!='9e50037af2eadacf80862412929ef6ce13079f25911d16d54b28766e74fe0b36':raise SystemExit('Reader helper pin refused')
          with (Path(os.environ['RUNNER_TEMP'])/'spamback-source-reader/reader.py').open('xb') as out:out.write(raw)
          PYCODE
      - name: Verify private source run without source checkout or other credentials
        env:
          SOURCE_READ_PLAN_JSON: ${{ inputs.plan_json }}
          SOURCE_READ_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          SPAMBACK_SOURCE_ACTIONS_READ_TOKEN: ${{ secrets.SPAMBACK_SOURCE_ACTIONS_READ_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          trap 'unset SPAMBACK_SOURCE_ACTIONS_READ_TOKEN' EXIT
          python3 -I "$RUNNER_TEMP/spamback-source-reader/reader.py" verify
      - name: Remove helper scratch on every outcome
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/spamback-source-reader"
