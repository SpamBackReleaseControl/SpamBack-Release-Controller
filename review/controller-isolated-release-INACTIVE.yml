name: Fresh-host fixed signing and upload consumer (INACTIVE)
run-name: Isolated release ${{ inputs.request_sha256 }}
'on':
  workflow_dispatch:
    inputs:
      request_sha256:
        required: true
        type: string
      private_request_commit:
        required: true
        type: string
      controller_commit:
        required: true
        type: string
      expires_at:
        required: true
        type: string
permissions: {}
concurrency:
  group: spamback-isolated-signing
  cancel-in-progress: false
jobs:
  signing-preflight:
    if: github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' && github.repository_id == '1443482676'
      && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor_id == '344105751' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
    - name: Refuse unreviewed release activation
      run: exit 78
    - name: Print bounded independent approval only
      env:
        REQUEST_SHA: ${{ inputs.request_sha256 }}
        REQUEST_COMMIT: ${{ inputs.private_request_commit }}
        CONTROLLER_COMMIT: ${{ inputs.controller_commit }}
        EXPIRY: ${{ inputs.expires_at }}
      run: "python3 -I - <<'PYCODE'\nimport os,re,time\nfor name,length in (('REQUEST_SHA',64),('REQUEST_COMMIT',40),('CONTROLLER_COMMIT',40)):\n\
        \    if re.fullmatch('[0-9a-f]{'+str(length)+'}',os.environ[name]) is None:raise SystemExit('Release pin refused')\n\
        if os.environ['GITHUB_SHA']!=os.environ['CONTROLLER_COMMIT'] or os.environ['GITHUB_WORKFLOW_SHA']!=os.environ['CONTROLLER_COMMIT']:raise\
        \ SystemExit('Controller code pin refused')\nif not int(time.time())<int(os.environ['EXPIRY'])<=int(time.time())+3600:raise\
        \ SystemExit('Release expiry refused')\nprint('APPROVE_ISOLATED_RELEASE '+os.environ['REQUEST_SHA']+' run:'+os.environ['GITHUB_RUN_ID'])\n\
        PYCODE\n"
  fixed-signer:
    needs: signing-preflight
    if: github.repository == 'SpamBackReleaseControl/SpamBack-Release-Controller' && github.repository_id == '1443482676'
      && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor_id == '344105751' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: macos-26
    environment: TestFlight-Approval
    timeout-minutes: 40
    permissions: {}
    env:
      RELEASE_REQUEST_SHA256: ${{ inputs.request_sha256 }}
      PRIVATE_REQUEST_COMMIT: ${{ inputs.private_request_commit }}
      APPROVED_CONTROLLER_COMMIT: ${{ inputs.controller_commit }}
      RELEASE_EXPIRES_AT: ${{ inputs.expires_at }}
      SPAMBACK_AGE_BINARY: ${{ runner.temp }}/spamback-fixed-code/age
      SPAMBACK_OPENSSL: /opt/homebrew/opt/openssl@3/bin/openssl
    steps:
    - name: Refuse unreviewed credential handoff/signing
      run: exit 78
    - name: Materialize exact reviewed trusted helpers
      shell: bash
      run: "set +x\nset -euo pipefail\numask 077\npython3 -I - <<'PYCODE'\nimport base64,hashlib,os\nfrom pathlib import Path\n\
        root=Path(os.environ['RUNNER_TEMP'])/'spamback-fixed-code'\nroot.mkdir(mode=0o700)\nfiles={'isolated_release.py':\
        \ '',\
        \ 'fixed_signing_consumer.py': '',\
        \ 'source_actions_attestor.py': '',\
        \ 'unsigned_boundary.py': '',\
        \ 'unsigned_transport.py': '',\
        \ 'unsigned_package.py': '',\
        \ 'stage_admission.py': '',\
        \ 'tree_admission.py': '',\
        \ 'archive_admission.py': '',\
        \ 'darwin_stage.py': '',\
        \ 'darwin_admission.c': '',\
        \ 'apfs_runtime_gate.py': '',\
        \ 'apfs_qualified_runtime.py': '',\
        \ 'release_public_config.py': '',\
        \ 'age_handoff_import.py': '',\
        \ 'apfs-qualification-43772206331/RESULT.json': '',\
        \ 'age-handoff/handoff_workflow.py': '',\
        \ 'age-handoff/handoff_provenance.py': '',\
        \ 'age-handoff/private_publication.py': '',\
        \ 'fixed_upload_consumer.py': '',\
        \ 'feed-integration/probe_signed_feed.py': '',\
        \ 'feed-integration/feed_http_framing.py': '',\
        \ 'feed-integration/release_contract.py': '',\
        \ 'feed-integration/validate_feed_configuration.py': ''}\n\
        pins={'isolated_release.py': '113efadd61bd20bfeac5e55c0d9acdde35a4c393c45ada3d3cd261c5d6458002', 'fixed_signing_consumer.py':\
        \ '32674877efcee1709cb8285e854ff63b4c6f315a45e16e67f989fcfadde9b7bb', 'source_actions_attestor.py': '9e50037af2eadacf80862412929ef6ce13079f25911d16d54b28766e74fe0b36',\
        \ 'unsigned_boundary.py': '37d2e323a62d3517e065e8b041f665b33059f5e2687e8e7b211e7da5dc0547a4', 'unsigned_transport.py':\
        \ '84c80252f625409ad794c586d613b6226e6c4d95f6805fe8314d8121dc0e796c', 'unsigned_package.py': '86c603ee8d672d2ea109e7c23c02e85a1695a863185fd7f52111f880697c8f6b',\
        \ 'stage_admission.py': 'eff6bd39bdee862406fab86569a161c119402bf677fe02eab9c2012d8599e3b8', 'tree_admission.py': '7be8b6ef30d8ccd73f1242d9b8e9ef1b476675899a43c2c6ce8ae6c974264bb4',\
        \ 'archive_admission.py': '3cde04246078fda9927fada89e0f9530012df1f9b6b3a3230f84afb714686ebc', 'darwin_stage.py': 'f57721ba1db0f5c3fd4ca3caf0cf5e28fdba8d8785642dac1b9a8c079a8a571c',\
        \ 'darwin_admission.c': 'a11b7a994fa8e5f28ebbc5a77e74c6c39719d59b4f31b68fb895542178a3fabe', 'apfs_runtime_gate.py':\
        \ '895671032a7e2f42d304fb9015477dc646e136458a3b494c467d16ebd1a9396b', 'apfs_qualified_runtime.py': '39cf61644989d35db47c1f9884fe88ce2ab68978a08bd600a0e6e2c6417a0e0f',\
        \ 'release_public_config.py': 'e23e50103363abc7a6000a7f74fd264d6fee40aa1c50f7320a35e22bc81bb776', 'age_handoff_import.py':\
        \ 'c0e01898cbccb7e5058d28359d8df411d698ca2cb2a031cd921e35a93fac86fa', 'apfs-qualification-43772206331/RESULT.json':\
        \ 'b33a17870198c91955fc578d956f7c39ec2c892ef12f554533bd9c948a47655f', 'age-handoff/handoff_workflow.py': 'a8646b101a5e6c9ae951f6a3aad3152ed674785ba072fedbabc838aacb2a8d63',\
        \ 'age-handoff/handoff_provenance.py': 'b8a8fae4793bedfb01ac95857e137be5cdf4761a07a5994344dfc3642c33a388', 'age-handoff/private_publication.py':\
        \ '830018ac855950e279ff03d2bfe8a300c3ef99e05e493a24ade4e73df99fec86', 'fixed_upload_consumer.py': 'b01e278beaf2ff31eb19c2f7ba9daa318e32083b48d37818551cfab852721302',\
        \ 'feed-integration/probe_signed_feed.py': '7f2457c4d8cef88a3d04887ecb099cdfd0589e9b09051c65071592d8971ac4ab', 'feed-integration/feed_http_framing.py':\
        \ '603321ab5ea5989fef6af968af79e7a4aa5e0581916c178cde435f8136374008', 'feed-integration/release_contract.py': '00d237ed7654d85e08e58a23c0d900d3e6a1fd2d667fa7ea4f009dd848600982',\
        \ 'feed-integration/validate_feed_configuration.py': 'c1bc1145653883a4ab6e7d4c280833dbeaca244efa9ed1fa7190d8a312dd11bd'}\n\
        for name,encoded in files.items():\n    raw=base64.b64decode(encoded,validate=True)\n    if hashlib.sha256(raw).hexdigest()!=pins[name]:raise\
        \ SystemExit('Controller helper pin refused')\n    target=root/name\n    target.parent.mkdir(parents=True,exist_ok=True,mode=0o700)\n\
        \    with target.open('xb') as out:out.write(raw)\nPYCODE\n"
    - name: Prepare SAME qualified age version for Darwin; verify package and executable
      shell: bash
      run: "set +x\nset -euo pipefail\ncurl --fail --location --proto '=https' --tlsv1.2 --max-time 120 https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-darwin-arm64.tar.gz\
        \ -o \"$RUNNER_TEMP/spamback-fixed-code/age.tar.gz\" >/dev/null 2>&1\npython3 -I - <<'PYCODE'\nimport hashlib,io,os,tarfile\n\
        from pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'spamback-fixed-code'\nraw=(root/'age.tar.gz').read_bytes()\n\
        if hashlib.sha256(raw).hexdigest()!='e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5':raise SystemExit('Darwin\
        \ age package refused')\nwith tarfile.open(fileobj=io.BytesIO(raw)) as archive:\n    entry=archive.getmember('age/age')\n\
        \    if not entry.isfile() or not 0<entry.size<20000000:raise SystemExit('Darwin age executable refused')\n    binary=archive.extractfile(entry).read()\n\
        if hashlib.sha256(binary).hexdigest()!='4012dfc2725883beafb710894af4f599b7a94f8c8e0f51f02cc96ab8df33915e':raise SystemExit('Darwin\
        \ age pin refused')\nwith (root/'age').open('xb') as out:out.write(binary)\n(root/'age').chmod(0o500)\nPYCODE\n"
    - name: Authenticate private request
      env: &id001
        SPAMBACK_SOURCE_READONLY_DEPLOY_KEY: ${{ secrets.SPAMBACK_SOURCE_READONLY_DEPLOY_KEY }}
      shell: bash
      run: 'set +x

        set -euo pipefail

        trap ''unset SPAMBACK_SOURCE_READONLY_DEPLOY_KEY'' EXIT

        python3 -I "$RUNNER_TEMP/spamback-fixed-code/isolated_release.py" fetch-release-request'
    - name: Admit, verify feed and Apple readiness, sign, clean keychain, upload fixed IPA
      env: *id001
      shell: bash
      run: 'set +x

        set -euo pipefail

        trap ''unset SPAMBACK_SOURCE_READONLY_DEPLOY_KEY'' EXIT

        python3 -I "$RUNNER_TEMP/spamback-fixed-code/isolated_release.py" release'
    - name: Remove private inputs, keys and signed output on every outcome
      if: always()
      run: 'set +x

        rm -rf -- "$RUNNER_TEMP/spamback-isolated-request" "$RUNNER_TEMP"/spamback-isolated-* "$RUNNER_TEMP/spamback-fixed-code"'
